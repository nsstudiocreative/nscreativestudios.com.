<style>
#nsc-briefing{
    --linen:#f3ece2; --espresso:#1e1714; --clay:#a84b2a; --terracotta:#d1774c;
    --sand:#e6cdbb; --stone:#6f6259;
    --display:"DM Serif Display", Georgia, serif;
    --sans:"DM Sans","Helvetica Neue",Arial,sans-serif;
  }
#nsc-briefing, #nsc-briefing *{box-sizing:border-box}
#nsc-briefing, #nsc-briefing{margin:0;background:var(--linen);color:var(--espresso);font-family:var(--sans);font-size:17px;line-height:1.5}
#nsc-briefing a{color:var(--clay)}
#nsc-briefing .wrap{max-width:760px;margin:0 auto;padding:0 24px}
#nsc-briefing .hero{background:var(--espresso);color:var(--linen);padding:40px 0 56px}
#nsc-briefing .brand{display:flex;align-items:center;gap:14px;margin-bottom:56px}
#nsc-briefing .brand svg{width:44px;height:44px;flex:none}
#nsc-briefing .brand svg path{stroke:var(--linen)}
#nsc-briefing .brand svg circle{fill:var(--terracotta)}
#nsc-briefing .brand .name{font-family:var(--display);font-size:24px;line-height:1}
#nsc-briefing .brand .name em{color:var(--terracotta)}
#nsc-briefing .label{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px}
#nsc-briefing .hero .label{color:var(--sand)}
#nsc-briefing h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1.05;letter-spacing:-.015em;margin:14px 0 20px}
#nsc-briefing h1 em{color:var(--terracotta)}
#nsc-briefing .hero p{color:var(--sand);max-width:560px;margin:0;font-size:18px}
#nsc-briefing .meta{display:flex;gap:28px;margin-top:32px;color:var(--sand);font-size:14px}
#nsc-briefing .meta b{display:block;color:var(--linen);font-size:15px}
#nsc-briefing .progress{position:sticky;top:0;z-index:5;background:var(--linen);border-bottom:1px solid var(--sand)}
#nsc-briefing .progress .wrap{display:flex;align-items:center;gap:14px;height:48px}
#nsc-briefing .bar{flex:1;height:3px;background:var(--sand)}
#nsc-briefing .bar i{display:block;height:100%;width:0;background:var(--clay);transition:width .3s ease}
#nsc-briefing .progress span{font-size:13px;color:var(--stone);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
#nsc-briefing section{padding:56px 0 8px;border-bottom:1px solid var(--sand)}
#nsc-briefing section .label{color:var(--clay)}
#nsc-briefing h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5.5vw,40px);line-height:1.1;letter-spacing:-.01em;margin:10px 0 8px}
#nsc-briefing h2 em{color:var(--clay)}
#nsc-briefing .intro{color:var(--stone);margin:0 0 28px}
#nsc-briefing .q{margin:0 0 30px}
#nsc-briefing .q > label, #nsc-briefing .q > .qt{display:block;font-weight:500;margin-bottom:10px}
#nsc-briefing .q .hint{display:block;font-weight:400;color:var(--stone);font-size:14px;margin-top:2px}
#nsc-briefing input[type=text], #nsc-briefing input[type=email], #nsc-briefing input[type=tel], #nsc-briefing input[type=date], #nsc-briefing textarea{
    width:100%;font:inherit;color:var(--espresso);background:#fbf7f1;border:1px solid var(--sand);
    border-radius:0;padding:13px 14px;outline:none;transition:border-color .15s}
#nsc-briefing textarea{min-height:96px;resize:vertical}
#nsc-briefing input:focus, #nsc-briefing textarea:focus{border-color:var(--clay);box-shadow:0 0 0 1px var(--clay)}
#nsc-briefing .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){#nsc-briefing .row2{grid-template-columns:1fr}
}
#nsc-briefing .opts{display:flex;flex-wrap:wrap;gap:8px}
#nsc-briefing .opt{position:relative}
#nsc-briefing .opt input{position:absolute;opacity:0;pointer-events:none}
#nsc-briefing .opt span{display:inline-block;padding:9px 14px;border:1px solid var(--sand);background:#fbf7f1;cursor:pointer;font-size:15px;user-select:none;transition:background .15s,border-color .15s}
#nsc-briefing .opt input:focus-visible + span{outline:2px solid var(--clay);outline-offset:2px}
#nsc-briefing .opt input:checked + span{background:var(--espresso);color:var(--linen);border-color:var(--espresso)}
#nsc-briefing .other{margin-top:10px}
#nsc-briefing .submit{padding:56px 0 72px}
#nsc-briefing .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;
    padding:16px 26px;border:0;border-radius:0;cursor:pointer;text-decoration:none}
#nsc-briefing .btn-primary{background:var(--espresso);color:var(--linen)}
#nsc-briefing .btn-primary:hover{background:#352a25}
#nsc-briefing .btn-ghost{background:transparent;color:var(--espresso);border:1px solid var(--espresso)}
#nsc-briefing .btn-accent{background:var(--terracotta);color:var(--espresso)}
#nsc-briefing .err{color:var(--clay);font-size:15px;margin-top:14px;min-height:1em}
#nsc-briefing .req{color:var(--clay)}
#nsc-briefing .done{display:none;padding:56px 0 72px}
#nsc-briefing .done.show{display:block}
#nsc-briefing .done h2 em{color:var(--clay)}
#nsc-briefing .actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
#nsc-briefing .summary{background:#fbf7f1;border:1px solid var(--sand);padding:20px;white-space:pre-wrap;font-size:14px;max-height:340px;overflow:auto}
#nsc-briefing .note{color:var(--stone);font-size:14px}
#nsc-briefing footer{background:var(--espresso);color:var(--sand);padding:28px 0;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
#nsc-briefing footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
#nsc-briefing .hidden{display:none}
#nsc-briefing{background:var(--linen);color:var(--espresso);font-family:var(--sans);font-size:17px;line-height:1.5;text-align:left;-webkit-font-smoothing:antialiased}
#nsc-briefing p,#nsc-briefing label,#nsc-briefing span,#nsc-briefing div{font-family:var(--sans)}
#nsc-briefing h1,#nsc-briefing h2{font-family:var(--display)!important;text-transform:none;font-weight:400}
#nsc-briefing p{margin:0 0 1em}
#nsc-briefing .hero p{margin:0}
#nsc-briefing button,#nsc-briefing .btn{font-family:var(--sans)!important;line-height:1.2}
#nsc-briefing .btn-accent{color:var(--espresso)!important} #nsc-briefing .btn-primary{color:var(--linen)!important} #nsc-briefing .btn-ghost{color:var(--espresso)!important}
#nsc-briefing .sent-ok{display:none} #nsc-briefing .sent-ok.show{display:block}
#nsc-briefing .fallback.hidden{display:none}
#nsc-briefing .hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:56px}
#nsc-briefing .hero-top .brand{margin-bottom:0}
#nsc-briefing .lang{display:inline-flex;border:1px solid rgba(243,236,226,.45)}
#nsc-briefing .lang button{appearance:none;background:transparent;border:0;color:var(--sand);font:700 13px/1 var(--sans)!important;letter-spacing:.14em;padding:10px 12px;cursor:pointer;min-height:40px}
#nsc-briefing .lang button[aria-pressed="true"]{background:var(--linen);color:var(--espresso)}
</style>

 "Is there an event or launch tied to that date?"], "type": "text", "half": true}, {"id": "verba", "q": ["Qual faixa de investimento você prevê?", "What budget range do you have in mind?"], "type": "single", "opts": [["Até US$ 1.500", "Up to $1,500"], ["US$ 1.500 – 3.000", "$1,500 – $3,000"], ["US$ 3.000 – 6.000", "$3,000 – $6,000"], ["Acima de US$ 6.000", "Over $6,000"], ["Prefiro conversar", "I’d rather talk about it"]]}, {"id": "pagamento", "q": ["Como prefere pagar?", "How would you prefer to pay?"], "type": "single", "opts": [["À vista", "In full"], ["Parcelado", "In installments"], ["Por etapas do projeto", "By project milestone"]]}, {"id": "extra", "q": ["Algo mais que devemos saber?", "Anything else we should know?"], "type": "area"}]}];

const root = document.getElementById("nsc-briefing");
const form = document.getElementById("form");
const KEY = "nsc-briefing-site-v1";
const IDX = { pt: 0, en: 1 };
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}

// language: ?lang=en in the link wins, then the last choice, then the browser language
let lang = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
if (!UI[lang]) { try { lang = localStorage.getItem(KEY + "-lang") || ""; } catch(e) {} }
if (!UI[lang]) lang = /^pt/i.test(navigator.language || "") ? "pt" : "en";

const T = k => UI[lang][k];
const L = v => Array.isArray(v) ? v[IDX[lang]] : v;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function applyLang(){
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = T("title");
  root.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T(el.dataset.t); });
  root.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem(KEY + "-lang", lang); } catch(e) {}
}

function render(){
  let html = "";
  SECTIONS.forEach((s, si) => {
    html += `<section><div class="label">${L(s.label)}</div><h2>${L(s.title)}</h2>`;
    if (si === 0) html += `<p class="intro">${T("req")}</p>`; else html += `<div style="height:20px"></div>`;
    let open = false;
    s.qs.forEach((q, qi) => {
      if (q.half && !open) { html += `<div class="row2">`; open = true; }
      html += field(q);
      const next = s.qs[qi+1];
      if (open && (!next || !next.half)) { html += `</div>`; open = false; }
    });
    if (open) html += `</div>`;
    html += `</section>`;
  });
  form.innerHTML = html;
}

function field(q){
  const req = q.req ? ' <span class="req">*</span>' : "";
  const hint = q.hint ? `<span class="hint">${esc(L(q.hint))}</span>` : "";
  const v = saved[q.id];
  if (["text","email","tel","date"].includes(q.type)) {
    return `<div class="q"><label for="${q.id}">${esc(L(q.q))}${req}${hint}</label><input type="${q.type}" id="${q.id}" name="${q.id}" value="${esc(v||"")}"${q.req?" required":""}></div>`;
  }
  if (q.type === "area") {
    return `<div class="q"><label for="${q.id}">${esc(L(q.q))}${req}${hint}</label><textarea id="${q.id}" name="${q.id}">${esc(v||"")}</textarea></div>`;
  }
  const kind = q.type === "multi" ? "checkbox" : "radio";
  const vals = Array.isArray(v) ? v : (v ? [v] : []);
  let o = `<div class="q" role="group" aria-labelledby="t_${q.id}"><div class="qt" id="t_${q.id}">${esc(L(q.q))}${req}${hint}</div><div class="opts">`;
  q.opts.forEach(opt => {
    o += `<label class="opt"><input type="${kind}" name="${q.id}" value="${esc(opt[0])}"${vals.includes(opt[0])?" checked":""}><span>${esc(L(opt))}</span></label>`;
  });
  o += `</div>`;
  if (q.other) {
    const ph = Array.isArray(q.other) ? L(q.other) : T("other");
    o += `<input class="other" type="text" name="${q.id}__outro" placeholder="${esc(ph)}" value="${esc(saved[q.id+"__outro"]||"")}">`;
  }
  return o + `</div>`;
}

function collect(){
  const data = {};
  SECTIONS.forEach(s => s.qs.forEach(q => {
    if (q.type === "multi") data[q.id] = [...form.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    else if (q.type === "single") { const c = form.querySelector(`input[name="${q.id}"]:checked`); data[q.id] = c ? c.value : ""; }
    else data[q.id] = (form.querySelector(`#${q.id}`).value || "").trim();
    if (q.other) data[q.id+"__outro"] = (form.querySelector(`input[name="${q.id}__outro"]`).value || "").trim();
  }));
  return data;
}

function progress(){
  const d = collect(); let total = 0, done = 0;
  SECTIONS.forEach(s => s.qs.forEach(q => {
    total++;
    const v = d[q.id]; const o = d[q.id+"__outro"];
    if ((Array.isArray(v) ? v.length : v) || o) done++;
  }));
  const p = Math.round(done/total*100);
  document.getElementById("barFill").style.width = p + "%";
  document.getElementById("pct").textContent = p + "%";
  saved = d;
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
}

// answer text in the current language (stored values are the Portuguese option text)
function shown(q, d){
  let v = d[q.id];
  if (q.opts) { const map = o => { const f = q.opts.find(x => x[0] === o); return f ? L(f) : o; }; v = Array.isArray(v) ? v.map(map).join(", ") : (v ? map(v) : ""); }
  const o = d[q.id+"__outro"]; if (o) v = v ? `${v} (${o})` : o;
  return v;
}

function summaryText(d){
  let out = T("sumHead") + "\n";
  SECTIONS.forEach(s => {
    const lines = [];
    s.qs.forEach(q => { const v = shown(q, d); if (v) lines.push(`• ${L(q.q)}\n  ${v}`); });
    if (lines.length) out += `\n— ${L(s.label).toUpperCase()} —\n` + lines.join("\n") + "\n";
  });
  return out.trim();
}

function setLang(l){
  if (!UI[l] || l === lang) return;
  progress(); lang = l; applyLang(); render(); progress();
}

applyLang(); render(); progress();
form.addEventListener("input", progress);
form.addEventListener("change", progress);
form.addEventListener("submit", e => e.preventDefault());
root.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

function showDone(){
  form.classList.add("hidden"); document.getElementById("submitBox").classList.add("hidden");
  root.querySelector(".progress").classList.add("hidden");
  const done = document.getElementById("done"); done.classList.add("show");
  done.scrollIntoView({behavior:"smooth"});
}

function prepareFallback(d, text){
  document.getElementById("summary").textContent = text;
  const subj = `${T("subject")} — ${d.empresa || d.nome}`;
  const enc = encodeURIComponent(text);
  const wa = document.getElementById("waBtn");
  if (CONTACT.whatsapp) wa.href = `https://wa.me/${CONTACT.whatsapp}?text=${enc}`; else wa.style.display = "none";
  document.getElementById("mailBtn").href = `mailto:${CONTACT.email}?subject=${encodeURIComponent(subj)}&body=${enc}`;
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const d = collect(); const err = document.getElementById("err"); const btn = document.getElementById("submitBtn");
  if (document.getElementById("hp").value) return;
  const missing = [];
  SECTIONS.forEach(s => s.qs.forEach(q => { if (q.req && !d[q.id]) missing.push(L(q.q)); }));
  if (missing.length) {
    err.textContent = T("missing") + missing.join(", ") + ".";
    const first = SECTIONS.flatMap(s=>s.qs).find(q => q.req && !d[q.id]);
    const el = document.getElementById(first.id); if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); el.focus({preventScroll:true}); }
    return;
  }
  err.textContent = "";
  const text = summaryText(d);
  prepareFallback(d, text);

  btn.disabled = true; btn.textContent = T("sending");
  const payload = { _subject: `${T("subject")} — ${d.empresa || d.nome}`, _template: "box", _captcha: "false", email: d.email, "Idioma / Language": T("langName"), "Resumo": text };
  SECTIONS.forEach(s => s.qs.forEach(q => { const v = shown(q, d); if (v) payload[`${L(s.label)} — ${L(q.q)}`] = v; }));
  try {
    const r = await fetch(FORM_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !(j.success === true || j.success === "true")) throw new Error("status " + r.status);
    try { localStorage.removeItem(KEY); } catch(e) {}
    location.href = "/briefing/obrigado/" + (lang === "en" ? "?lang=en" : "");
    return;
  } catch(e) {
    document.getElementById("fbIntro").textContent = T("fbFail");
    showDone();
  } finally {
    btn.disabled = false; btn.textContent = T("send");
  }
});

document.getElementById("copyBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(document.getElementById("summary").textContent); btn.textContent = T("copied"); }
  catch(_) {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("summary"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = T("selected");
  }
  setTimeout(()=>btn.textContent=T("copy"), 2500);
});

document.getElementById("editBtn").addEventListener("click", () => {
  form.classList.remove("hidden"); document.getElementById("submitBox").classList.remove("hidden");
  root.querySelector(".progress").classList.remove("hidden");
  document.getElementById("done").classList.remove("show");
  root.scrollIntoView({behavior:"smooth"});
});
})();
</script>
